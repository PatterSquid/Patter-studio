<!doctype html>
<html lang="en-GB"><head>
<script>window.addEventListener('error', function () { try { if (window.PatterLauncher && window.PatterLauncher.crashed) window.PatterLauncher.crashed(); } catch (e) { } });</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patter Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:ital,wght@0,400;0,700;1,400&family=Archivo:wght@400;600&family=Lora:ital,wght@0,400;1,500&family=Kalam:wght@700&family=Gochi+Hand&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>/*CSS*/</style></head>
<body>
<header>
  <div class="brand"><b>PATTER</b> STUDIO</div>
  <nav id="tabs" aria-label="Workspaces">
    <button data-mod="video" title="Edit your video: footage, clips, sound, text, transitions">Video</button>
    <button data-group="gfx" title="Make animated graphics: charts, maps, newspapers, Story and more">Graphics</button>
    <button data-mod="audio" title="Clean up and edit your voice recordings">Audio</button>
    <button data-group="anim" title="Your studio and your character">Animator</button>
    <button data-mod="thumb" title="Make your YouTube thumbnails: pictures, words, background removal">Thumbnail</button>
    <button data-mod="intro" hidden>Intro</button>
  </nav>
  <div class="hdr-tools">
    <span class="saved" id="savedNote" aria-live="polite"></span>
    <button id="hdrUndo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button id="hdrRedo" class="icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button id="libBtn" class="proj" title="Your projects: open, start a new one, history, save to a file"><span id="projName">Untitled clip</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <button id="histBtn" hidden title="Version history: roll back to an earlier version">History</button>
    <button id="openProj" hidden title="Open a project file from your computer">Open file</button>
    <button id="saveProj" hidden title="Save this project to a file, for backups or another computer">Save file</button>
    <button id="keysBtn" class="icon" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
    <button id="hdrExport" class="cut-x" title="Export (Ctrl+E)">Export</button>
    <input id="projFile" type="file" accept=".json,application/json" hidden>
  </div>
</header>
<main>
  <nav id="animRail" class="rail" aria-label="Animator" hidden>
    <button data-mod="studio" title="Studio: your room brought to life"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M12 4v13M3 10h18M8 21h8M12 17v4"/></svg><span>Studio</span></button>
    <button data-mod="char" title="Character: your puppet talking from your voice"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="M10 11.5c1 .8 3 .8 4 0M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg><span>Character</span></button>
  </nav>
  <nav id="gfxRail" class="rail" aria-label="Graphics makers" hidden>
    <button data-mod="charts" title="Charts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Charts</span></button>
    <button data-mod="timeline" title="Timeline"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h20M6 8v8M12 8v8M18 8v8"/></svg><span>Timeline</span></button>
    <button data-mod="map" title="World map"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span>World map</span></button>
    <button data-mod="flights" title="Flights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c5-9 13-11 18-10M17 4l4 3-4 3"/></svg><span>Flights</span></button>
    <button data-mod="flyover" title="Flyover"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20l6-9 4 5 3-4 7 8z"/><circle cx="17" cy="6" r="2"/></svg><span>Flyover</span></button>
    <button data-mod="picto" title="Pictogram"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="18" cy="7" r="2"/><path d="M4 18v-6h4v6M10 18v-6h4v6M16 18v-6h4v6"/></svg><span>Pictogram</span></button>
    <button data-mod="news" title="Newspaper"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M7 8h10M7 12h4M13 12h4M7 16h4M13 16h4"/></svg><span>Newspaper</span></button>
    <button data-mod="story" title="Story"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M12 15l-4 6M12 15l4 6M7 10l5 1 5-3"/></svg><span>Story</span></button>
    <button data-mod="broll" title="B roll"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="1"/><path d="M16 10l6-3v10l-6-3"/><path d="M5 14l3-4 3 4"/></svg><span>B roll</span></button>
  </nav>
  <aside>
    <div class="aside-tabs" role="tablist" aria-label="Settings"><button type="button" role="tab" data-at="set" class="on">Settings</button><button type="button" role="tab" data-at="look">Look</button></div>
    <section class="card" id="look">
      <h3>Look</h3>
      <div class="field"><span class="lab">Colour scheme</span><div class="swatches" id="schemes"></div></div>
      <div class="grid2">
        <label class="field"><span class="lab">Banner colour</span><select id="banner"></select></label>
        <label class="field"><span class="lab">Format</span><select id="format"><option value="16:9">16:9 YouTube</option><option value="9:16">9:16 Shorts</option></select></label>
      </div>
      <label class="check"><input type="checkbox" id="texture"> Halftone texture on the background</label>
      <label class="check"><input type="checkbox" id="transparent"> Transparent background (exports a PNG sequence)</label>
    </section>
    <div id="editBanner" class="edit-banner" hidden></div>
    <div id="inspector" style="display:flex;flex-direction:column;gap:12px"></div>
    <button id="manualBtn" type="button" aria-expanded="false">Show manual inputs</button>
    <div id="modForm" style="display:flex;flex-direction:column;gap:12px"></div>
    <button id="resetMod">Reset this clip to the example</button>
  </aside>
  <section class="stagecol">
    <div class="pvbox"><div class="preview" id="prevWrap"><canvas id="prev" role="img" aria-label="Live preview of the clip"></canvas></div></div>
    <div class="transport">
      <button id="playBtn" aria-label="Play">Play</button>
      <button id="restartBtn" aria-label="Play from the start">Restart</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub through the clip">
      <span class="time" id="time">0.0 / 0.0 s</span>
      <details class="pvset"><summary title="Preview settings" aria-label="Preview settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></summary><div class="pvset-pop">
      <label class="pq" title="How sharp the preview is. Draft is fastest on slow laptops. Export is always full quality."><span class="lab">Preview</span><select id="pq" aria-label="Preview quality"><option value="draft">Draft</option><option value="normal">Normal</option><option value="full">Full</option></select></label>
      <label class="pq" title="Where the preview is drawn. Processor is much faster on laptops with built in graphics; try Graphics card on a PC with a proper graphics card. Exports are not affected."><span class="lab">Draw on</span><select id="pdraw" aria-label="Draw the preview on"><option value="cpu">Processor</option><option value="gpu">Graphics card</option></select></label>
      <label class="pq" title="Start playing the preview straight away when you open a clip"><input type="checkbox" id="autoplay"><span class="lab">Autoplay</span></label>
      <label class="pq" title="Draw the clip ahead in the background so playback is always smooth. The yellow bar on the scrubber shows how much is ready."><input type="checkbox" id="smooth"><span class="lab">Smooth</span></label>
      </div></details>
    </div>
    <section class="card tl" id="timeline" aria-label="Timeline"></section>
    <section class="card export" aria-label="Export">
      <div class="exp-head"><h3>Export</h3><button type="button" class="icon" id="expClose" title="Close" aria-label="Close">×</button></div>
      <div class="exprow">
        <label class="field" style="min-width:200px"><span class="lab">Motion blur</span><select id="blur"><option value="smart">Smart, only where things move fast</option><option value="off">Off, fastest</option><option value="full">Every frame, slowest</option></select></label>
        <label class="field" style="min-width:140px"><span class="lab">Frame rate</span><select id="fps"><option value="60">60 fps</option><option value="30">30 fps</option></select></label>
        <label class="check" title="Draws the globe on the graphics chip. Much faster on maps and flights. Untick only if the globe looks wrong."><input type="checkbox" id="gpu" checked> Use graphics chip</label>
        <button class="primary" id="exportBtn">Export MP4</button>
        <button id="cancelBtn" hidden>Cancel</button>
      </div>
      <div class="exprow range"><label class="check"><input type="checkbox" id="rangeOn" disabled> Only export from the in point to the out point</label><span class="hint" id="rangeTxt"></span>
        <span class="btnrow"><button id="setIn" title="Set the in point at the playhead (I)">Set in</button><button id="setOut" title="Set the out point at the playhead (O)">Set out</button><button id="playRange" title="Loop the range in the preview (P)" disabled>Loop the range</button><button id="clearRange" title="Clear the in and out points (X)" disabled>Clear</button></span></div>
      <div class="exprow"><div class="bar"><i id="barFill"></i></div><span class="status" id="status">Ready. The preview is a quick draft; the export renders every frame at full quality.</span></div>
    </section>
  </section>
</main>
<dialog id="dlg" aria-label="Dialog"></dialog>
<script id="patter-js">/*JS*/</script>
</body></html>
